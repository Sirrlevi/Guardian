name: Android Build and Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guardian-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and install API 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found under $SDK_ROOT"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run tests and build debug APKs
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: |
          gradle --no-daemon clean \
            :core:test \
            :parent:testDebugUnitTest \
            :child:testDebugUnitTest \
            :parent:assembleDebug \
            :child:assembleDebug

      - name: Lint (Parent and Child)
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: |
          gradle --no-daemon :parent:lintDebug :child:lintDebug

      - name: Verify debug APKs
        shell: bash
        run: |
          set -euo pipefail
          BT="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/35.0.0)"
          for pair in "parent:com.sirrlevi.guardian.parent" "child:com.sirrlevi.guardian.child"; do
            module="${pair%%:*}"; pkg="${pair##*:}"
            apk="$(ls $module/build/outputs/apk/debug/*.apk | head -n 1)"
            badging="$("$BT/aapt2" dump badging "$apk")"
            echo "$badging" | grep -q "package: name='$pkg'" || { echo "::error::$apk has the wrong package name"; exit 1; }
            echo "$badging" | head -n 1
          done
          echo "Debug APK package names verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Configure persistent release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] &&
             [ -n "$ANDROID_KEYSTORE_PASSWORD" ] &&
             [ -n "$ANDROID_KEY_ALIAS" ] &&
             [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > guardian-release.jks
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            missing=""
            for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
              if [ -z "${!name}" ]; then missing="$missing $name"; fi
            done
            echo "::warning::Signed release NOT published. Missing repository secrets:$missing. In-app updates cannot find a new build until they are added."
            {
              echo "### Signed release was NOT published"
              echo
              echo "Missing repository secrets:$missing"
              echo
              echo "Add them under Settings -> Secrets and variables -> Actions, then re-run this workflow. Until then the apps have no update to find."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build signed release APKs
        if: steps.signing.outputs.ready == 'true'
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :parent:assembleRelease :child:assembleRelease

      - name: Prepare signed release assets
        id: assets
        if: steps.signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p release-assets
          test -f parent/build/outputs/apk/release/parent-release.apk
          test -f child/build/outputs/apk/release/child-release.apk
          cp parent/build/outputs/apk/release/parent-release.apk release-assets/Guardian-Parent.apk
          cp child/build/outputs/apk/release/child-release.apk release-assets/Guardian-Child.apk
          echo "mode=Persistent-key signed release" >> "$GITHUB_OUTPUT"

      - name: Verify signed release APKs
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BT="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/35.0.0)"
          certs=""
          for pair in "Parent:com.sirrlevi.guardian.parent" "Child:com.sirrlevi.guardian.child"; do
            name="${pair%%:*}"; pkg="${pair##*:}"
            apk="release-assets/Guardian-$name.apk"
            "$BT/apksigner" verify --verbose "$apk"
            badging="$("$BT/aapt2" dump badging "$apk")"
            echo "$badging" | grep -q "package: name='$pkg'" || { echo "::error::$apk has the wrong package name"; exit 1; }
            echo "$badging" | grep -q "versionCode='${{ github.run_number }}'" || { echo "::error::$apk has an unexpected versionCode"; exit 1; }
            if "$BT/apksigner" verify --print-certs "$apk" | grep -qi "Android Debug"; then
              echo "::error::$apk is signed with the Android debug key"; exit 1
            fi
            cert="$("$BT/apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"
            echo "$name signer SHA-256: $cert"
            certs="$certs $cert"
          done
          unique="$(echo $certs | tr ' ' '\n' | sort -u | wc -l)"
          [ "$unique" -eq 1 ] || { echo "::error::Parent and Child are not signed with the same key"; exit 1; }
          {
            echo "### Signed APKs verified"
            echo "Both APKs verify with apksigner, have the expected package names and versionCode ${{ github.run_number }}, and share one persistent signing key."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Guardian-Android-APKs-${{ github.run_number }}
          path: |
            parent/build/outputs/apk/debug/*.apk
            child/build/outputs/apk/debug/*.apk
            parent/build/outputs/apk/release/*.apk
            child/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 3

      - name: Publish debug build as a pre-release (testing only)
        if: steps.signing.outputs.ready != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p debug-assets
          cp "$(ls parent/build/outputs/apk/debug/*.apk | head -n 1)" debug-assets/Guardian-Parent-debug.apk
          cp "$(ls child/build/outputs/apk/debug/*.apk | head -n 1)" debug-assets/Guardian-Child-debug.apk
          tag="guardian-debug-v1.0.${{ github.run_number }}"
          gh release create "$tag" debug-assets/*.apk \
            --target "${{ github.sha }}" --prerelease --latest=false \
            --title "Guardian debug build ${{ github.run_number }} (testing only)" \
            --notes "Debug-signed test build from commit ${{ github.sha }}. NOT used by in-app updates (pre-release). Add the four signing secrets to get signed releases that update in place."
          gh release list --limit 100 --json tagName,isPrerelease \
            -q '.[] | select(.isPrerelease and (.tagName | startswith("guardian-debug-"))) | .tagName' \
            | tail -n +4 | while read -r old; do gh release delete "$old" --cleanup-tag -y; done
          {
            echo "### Debug test build published"
            echo "Pre-release: $tag (Guardian-Parent-debug.apk, Guardian-Child-debug.apk). In-app updates ignore it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish latest signed APK release
        if: steps.signing.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: guardian-v1.0.${{ github.run_number }}
          name: Guardian v1.0.${{ github.run_number }}
          body: |
            Automated Android build from commit ${{ github.sha }}.

            Build type: ${{ steps.assets.outputs.mode }}

            Both Parent and Child APKs are signed with the repository's persistent Android upload key. These packages are eligible for in-place Android updates.
          files: release-assets/*.apk
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize published release
        if: steps.signing.outputs.ready == 'true'
        run: |
          {
            echo "### Signed release published"
            echo
            echo "Tag: guardian-v1.0.${{ github.run_number }} (versionCode ${{ github.run_number }})"
            echo "Assets: Guardian-Parent.apk, Guardian-Child.apk"
          } >> "$GITHUB_STEP_SUMMARY"
